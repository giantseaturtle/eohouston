<script>
  // Only reachable via a contact form's formsubmit.co _next redirect, so a page view here
  // means that form was submitted successfully. ?src= says which form it was (see the
  // _next values in join.html / momentum.html); untagged submissions stay 'join' for
  // continuity with the events already collected before the parameter existed.
  (function () {
    var src = (new URLSearchParams(location.search).get('src') || 'join').toLowerCase();
    var map = { join: 'join_form_submit', momentum: 'momentum_form_submit' };
    var name = map[src] || 'join_form_submit';
    var send = window.eoTrack || function (n, p) {
      if (typeof gtag === 'function') gtag('event', n, p || {});
    };
    send(name, { form_source: src });
    send('lead_submit', { form_source: src });
  })();
